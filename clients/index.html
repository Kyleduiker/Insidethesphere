<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients — Inside The Sphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script>window.sphereActivePage = 'clients';</script>
<script src="../js/header.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --obs:#0F0F0F;--esp:#2C2420;--stone:#8C8479;
  --parch:#EDE8E0;--ivory:#F7F4EF;--border:#D9D3CB;
  --champ:#C9A96E;--copper:#A0714F;--sage:#4A5C4E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--ivory);color:var(--obs);min-height:100vh;display:flex}

/* Sidebar styles now live in js/header.js */

/* MAIN */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{
  background:#fff;border-bottom:0.5px solid var(--border);
  padding:0 36px;height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:50;
}
.topbar-title{font-size:13px;font-weight:500;color:var(--obs);flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:12px}
.search-box{
  width:220px;padding:7px 12px;background:var(--ivory);
  border:0.5px solid var(--border);border-radius:2px;
  font-size:12px;color:var(--obs);font-family:var(--sans);
  transition:border-color .12s,background .12s;
}
.search-box:focus{outline:none;border-color:var(--obs);background:#fff}
.search-box::placeholder{color:var(--border)}
.btn-new{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;background:var(--obs);border:none;border-radius:2px;
  font-size:11px;font-weight:500;color:#fff;cursor:pointer;
  font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;
  transition:background .12s;white-space:nowrap;
}
.btn-new:hover{background:var(--esp)}

/* PAGE */
.page{padding:36px;flex:1}

/* COUNT STRIP */
.count-strip{
  font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--stone);margin-bottom:14px;
}

/* CLIENT TABLE */
.cl-table{background:#fff;border:0.5px solid var(--border);margin-bottom:32px}
.cl-header-row{
  display:grid;grid-template-columns:1fr 150px 210px 90px 110px;
  gap:0;background:var(--ivory);
  border-bottom:0.5px solid var(--border);
  padding:10px 20px;
}
.col-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.cl-row{
  display:grid;grid-template-columns:1fr 150px 210px 90px 110px;
  gap:0;align-items:center;
  padding:16px 20px;border-bottom:0.5px solid var(--border);
  transition:background .12s;cursor:pointer;
}
.cl-row:last-child{border-bottom:none}
.cl-row:hover{background:var(--ivory)}
.cl-name{font-family:var(--serif);font-size:1rem;font-weight:400;color:var(--obs);line-height:1.2}
.cl-sub{font-size:11px;color:var(--stone);margin-top:3px}
.cl-cell{font-size:12px;color:var(--stone);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-cell a{color:var(--stone);text-decoration:none;transition:color .12s}
.cl-cell a:hover{color:var(--copper)}
.type-badge{
  display:inline-block;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;
}
.t-seller{background:rgba(74,92,78,.08);color:var(--sage);border:0.5px solid rgba(74,92,78,.2)}
.t-buyer{background:rgba(160,113,79,.08);color:var(--copper);border:0.5px solid rgba(160,113,79,.2)}
.t-both{background:var(--parch);color:var(--esp);border:0.5px solid var(--border)}
.cl-actions{display:flex;gap:6px;align-items:center}
.act-btn{
  font-size:10px;font-weight:500;letter-spacing:.06em;
  padding:5px 10px;border-radius:2px;cursor:pointer;
  font-family:var(--sans);transition:all .12s;border:none;
  text-decoration:none;display:inline-flex;align-items:center;
}
.act-open{background:var(--obs);color:#fff}
.act-open:hover{background:var(--esp)}
.act-del{background:transparent;color:#D9D3CB;border:none;font-size:14px;padding:4px 6px}
.act-del:hover{color:#c0392b}

/* EMPTY */
.empty{padding:64px 20px;text-align:center;background:#fff;border:0.5px solid var(--border)}
.empty-title{font-family:var(--serif);font-size:1.6rem;font-weight:300;color:var(--obs);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--stone);margin-bottom:24px;line-height:1.6}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,15,15,.5);
  z-index:200;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all .2s;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  background:#fff;border-radius:2px;width:100%;max-width:560px;
  margin:20px;animation:mIn .2s ease;max-height:88vh;display:flex;flex-direction:column;
}
@keyframes mIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{
  padding:20px 24px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-title{font-family:var(--serif);font-size:1.3rem;font-weight:300;color:var(--obs)}
.modal-close{background:none;border:none;font-size:18px;color:var(--stone);cursor:pointer;padding:4px;transition:color .12s}
.modal-close:hover{color:var(--obs)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.form-sec{
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--copper);margin:0 0 12px;padding-top:4px;
}
.form-sec.spaced{margin-top:24px;padding-top:20px;border-top:0.5px solid var(--border)}
.fg{margin-bottom:16px}
.fg:last-child{margin-bottom:0}
.fg label{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-bottom:6px}
.fg input,.fg select,.fg textarea{
  width:100%;padding:10px 12px;background:var(--ivory);
  border:0.5px solid var(--border);border-radius:2px;
  font-size:14px;color:var(--obs);font-family:var(--sans);
  transition:border-color .12s,background .12s;
}
.fg textarea{resize:vertical;min-height:70px;line-height:1.5}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--obs);background:#fff}
.fg input::placeholder,.fg textarea::placeholder{color:var(--border)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.req{color:var(--copper)}
.modal-footer{
  padding:16px 24px;border-top:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-shrink:0;
}
.btn-cancel{
  padding:9px 18px;background:transparent;border:0.5px solid var(--border);
  border-radius:2px;font-size:12px;font-weight:500;color:var(--stone);
  cursor:pointer;font-family:var(--sans);letter-spacing:.06em;transition:all .12s;
}
.btn-cancel:hover{border-color:var(--obs);color:var(--obs)}
.btn-create{
  padding:9px 20px;background:var(--obs);border:none;border-radius:2px;
  font-size:12px;font-weight:500;color:#fff;cursor:pointer;
  font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;
  transition:background .12s;
}
.btn-create:hover{background:var(--esp)}
.btn-create:disabled{opacity:.5;cursor:not-allowed}

/* TOAST */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--obs);
  color:#fff;border-radius:2px;padding:10px 16px;
  font-size:12px;font-weight:500;z-index:500;
  transform:translateY(50px);opacity:0;transition:all .25s;letter-spacing:.04em;
}
.toast.show{transform:translateY(0);opacity:1}

/* LOADING */
.loading{margin-left:220px;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:14px}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--copper);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  /* header.js hides #sphere-sidebar at this same breakpoint */
  .main,.loading{margin-left:0}
  .cl-header-row,.cl-row{grid-template-columns:1fr 100px}
  .cl-header-row > *:nth-child(n+3),.cl-row > *:nth-child(n+3){display:none}
  .cl-header-row > *:last-child,.cl-row > *:last-child{display:flex}
  .page{padding:20px}
  .topbar{padding:0 20px;height:auto;min-height:56px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  .search-box{width:150px}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p style="font-size:13px;color:var(--stone)">Loading...</p>
</div>

<!-- SIDEBAR — injected by js/header.js -->
<div id="sphere-header"></div>

<!-- MAIN -->
<div class="main" id="main" style="display:none">
  <div class="topbar">
    <div class="topbar-title">Clients</div>
    <div class="topbar-right">
      <input class="search-box" id="search" placeholder="Search clients..." oninput="renderClients()">
      <button class="btn-new" onclick="openModal()">+ New Client</button>
    </div>
  </div>
  <div class="page">
    <div class="count-strip" id="count-strip"></div>
    <div id="client-container"></div>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New client</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <div class="form-sec">Owners</div>
      <div class="fg-row">
        <div class="fg">
          <label>Owner 1 name <span class="req">*</span></label>
          <input id="m-owner1" placeholder="John Smith">
        </div>
        <div class="fg">
          <label>Owner 2 name</label>
          <input id="m-owner2" placeholder="Sarah Smith">
        </div>
      </div>

      <div class="form-sec spaced">Contact</div>
      <div class="fg-row">
        <div class="fg">
          <label>Phone <span class="req">*</span></label>
          <input type="tel" id="m-phone" placeholder="403-555-0100">
        </div>
        <div class="fg">
          <label>Second phone</label>
          <input type="tel" id="m-phone2" placeholder="Optional">
        </div>
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>Email <span class="req">*</span></label>
          <input type="email" id="m-email" placeholder="john@email.com">
        </div>
        <div class="fg">
          <label>Second email</label>
          <input type="email" id="m-email2" placeholder="Optional">
        </div>
      </div>

      <div class="form-sec spaced">Property</div>
      <div class="fg">
        <label>Property address</label>
        <input id="m-address" placeholder="264 Mahogany Cove SE, Calgary">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>Community</label>
          <select id="m-community">
            <option value="">Select community</option>
            <option>Mahogany</option><option>Auburn Bay</option>
            <option>Seton</option><option>Cranston</option>
            <option>Legacy</option><option>Chestermere</option>
            <option>Other</option>
          </select>
        </div>
        <div class="fg">
          <label>Client type</label>
          <select id="m-type">
            <option>Seller</option>
            <option>Buyer</option>
            <option>Both</option>
          </select>
        </div>
      </div>

      <div class="form-sec spaced">Details</div>
      <div class="fg-row">
        <div class="fg">
          <label>Status</label>
          <select id="m-status">
            <option>Prospect</option>
            <option>Active</option>
            <option>Past client</option>
          </select>
        </div>
        <div class="fg">
          <label>Source</label>
          <select id="m-source">
            <option value="">Select source</option>
            <option>Sphere / referral</option>
            <option>Past client</option>
            <option>Open house</option>
            <option>Online lead</option>
            <option>Bold Trail</option>
            <option>Newsletter</option>
            <option>Sign call</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label>Notes</label>
        <textarea id="m-notes" placeholder="Timeline, motivation, anything worth remembering before the next call..."></textarea>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-create" id="btn-create" onclick="createClient()">Create client →</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let clients = [];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

firebase.auth().onAuthStateChanged(function(user) {
  if (!user) { window.location.href = '../login.html'; return; }
  currentUser = user;
  loadClients(user);
});

function loadClients(user) {
  db.collection('users').doc(user.uid).collection('clients')
    .get()
    .then(function(snap) {
      clients = snap.docs.map(function(d){
        const data = d.data();
        data.id = d.id;
        return data;
      });
      clients.sort(function(a, b){
        const an = (a.owner1Name || '').toLowerCase();
        const bn = (b.owner1Name || '').toLowerCase();
        return an < bn ? -1 : an > bn ? 1 : 0;
      });
      renderClients();
    })
    .catch(function(err){
      console.error('Client load failed:', err);
      showToast('Could not load clients — check console');
    })
    .finally(function(){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main').style.display = 'flex';
    });
}

function displayName(c) {
  return [c.owner1Name, c.owner2Name].filter(Boolean).join(' & ') || 'Unnamed client';
}

function typeClass(t) {
  if (t === 'Buyer') return 't-buyer';
  if (t === 'Both')  return 't-both';
  return 't-seller';
}

function renderClients() {
  const container = document.getElementById('client-container');
  const strip = document.getElementById('count-strip');
  const term = (document.getElementById('search').value || '').toLowerCase().trim();

  const list = !term ? clients : clients.filter(function(c){
    return [c.owner1Name, c.owner2Name, c.email, c.email2, c.phone, c.phone2, c.address, c.community]
      .filter(Boolean).join(' ').toLowerCase().indexOf(term) !== -1;
  });

  if (!clients.length) {
    strip.textContent = '';
    container.innerHTML =
      '<div class="empty">' +
        '<div class="empty-title">No clients yet</div>' +
        '<div class="empty-sub">Add a client once, then build a CMA or marketing<br>materials for them without retyping a thing.</div>' +
        '<button class="btn-new" onclick="openModal()">+ Add your first client</button>' +
      '</div>';
    return;
  }

  strip.textContent = list.length + (list.length === 1 ? ' client' : ' clients') +
    (term ? ' matching "' + term + '"' : '');

  if (!list.length) {
    container.innerHTML =
      '<div class="empty">' +
        '<div class="empty-title">No matches</div>' +
        '<div class="empty-sub">Nothing in your client list matches that search.</div>' +
      '</div>';
    return;
  }

  container.innerHTML =
    '<div class="cl-table">' +
      '<div class="cl-header-row">' +
        '<div class="col-lbl">Client</div>' +
        '<div class="col-lbl">Phone</div>' +
        '<div class="col-lbl">Email</div>' +
        '<div class="col-lbl">Type</div>' +
        '<div class="col-lbl">Actions</div>' +
      '</div>' +
      list.map(function(c){
        const t = c.type || 'Seller';
        return '<div class="cl-row" onclick="openClient(\'' + esc(c.id) + '\')">' +
          '<div>' +
            '<div class="cl-name">' + esc(displayName(c)) + '</div>' +
            '<div class="cl-sub">' + esc(c.address || c.community || '—') + '</div>' +
          '</div>' +
          '<div class="cl-cell">' + (c.phone ? '<a href="tel:' + esc(c.phone) + '" onclick="event.stopPropagation()">' + esc(c.phone) + '</a>' : '—') + '</div>' +
          '<div class="cl-cell">' + (c.email ? '<a href="mailto:' + esc(c.email) + '" onclick="event.stopPropagation()">' + esc(c.email) + '</a>' : '—') + '</div>' +
          '<div><span class="type-badge ' + typeClass(t) + '">' + esc(t) + '</span></div>' +
          '<div class="cl-actions">' +
            '<a href="view.html?id=' + encodeURIComponent(c.id) + '" class="act-btn act-open" onclick="event.stopPropagation()">Open</a>' +
            '<button class="act-btn act-del" onclick="deleteClient(\'' + esc(c.id) + '\',event)" title="Delete">✕</button>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
}

function openClient(id) {
  window.location.href = 'view.html?id=' + encodeURIComponent(id);
}

// MODAL
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('m-owner1').focus(); }, 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['m-owner1','m-owner2','m-phone','m-phone2','m-email','m-email2','m-address','m-notes']
    .forEach(function(id){
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
  document.getElementById('m-community').selectedIndex = 0;
  document.getElementById('m-type').selectedIndex = 0;
  document.getElementById('m-status').selectedIndex = 0;
  document.getElementById('m-source').selectedIndex = 0;
}

function createClient() {
  const owner1 = document.getElementById('m-owner1').value.trim();
  const owner2 = document.getElementById('m-owner2').value.trim();
  const phone  = document.getElementById('m-phone').value.trim();
  const phone2 = document.getElementById('m-phone2').value.trim();
  const email  = document.getElementById('m-email').value.trim();
  const email2 = document.getElementById('m-email2').value.trim();
  const address   = document.getElementById('m-address').value.trim();
  const community = document.getElementById('m-community').value;
  const type      = document.getElementById('m-type').value;
  const status    = document.getElementById('m-status').value;
  const source    = document.getElementById('m-source').value;
  const notes     = document.getElementById('m-notes').value.trim();

  if (!owner1) { showToast('Please enter the first owner name'); return; }
  if (!phone)  { showToast('Please enter a phone number'); return; }
  if (!email)  { showToast('Please enter an email address'); return; }

  const btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'Creating...';

  const now = firebase.firestore.FieldValue.serverTimestamp();

  db.collection('users').doc(currentUser.uid).collection('clients').add({
    owner1Name: owner1, owner2Name: owner2,
    phone: phone, phone2: phone2,
    email: email, email2: email2,
    address: address, community: community,
    type: type, status: status, source: source, notes: notes,
    agentId: currentUser.uid,
    createdAt: now, updatedAt: now
  })
  .then(function(ref){
    window.location.href = 'view.html?id=' + encodeURIComponent(ref.id);
  })
  .catch(function(err){
    console.error('Create client failed:', err);
    btn.disabled = false; btn.textContent = 'Create client →';
    showToast('Error creating client — please try again');
  });
}

function deleteClient(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this client? Any CMAs already built for them will stay, but will no longer be linked. This cannot be undone.')) return;
  db.collection('users').doc(currentUser.uid).collection('clients').doc(id).delete()
    .then(function(){
      clients = clients.filter(function(c){ return c.id !== id; });
      renderClients();
      showToast('Client deleted');
    })
    .catch(function(err){
      console.error('Delete failed:', err);
      showToast('Error deleting client');
    });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

/* Log out is handled by sphereLogout() in js/header.js */
</script>
</body>
</html>
