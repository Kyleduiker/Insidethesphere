<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Plan Builder | Inside the Sphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/profile.js"></script>

<style>
:root{
  --rls-red:#EA002A; --rls-red-dk:#B80021; --rls-black:#1A1A1A;
  --rls-dark-grey:#4A4A4A; --rls-warm-grey:#E6E2DC; --rls-light-grey:#F6F4F1;
  --rls-sans:'Raleway',sans-serif;
  --green:#2E7D4F; --amber:#C98A00;
  --bp-top-offset:84px; /* space for the portal header when the nav sticks */
}
*{box-sizing:border-box}
body{margin:0;background:var(--rls-light-grey);color:var(--rls-black);font-family:var(--rls-sans);font-size:15px;line-height:1.5}
.bp{max-width:1240px;margin:0 auto;padding:24px 16px 80px}

/* Hero */
.bp-hero{background:var(--rls-black);color:#fff;border-radius:6px;padding:28px 28px 22px;margin-bottom:20px;position:relative;overflow:hidden}
.bp-hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--rls-red)}
.bp-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.bp-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#bbb;font-weight:600}
.bp-hero h1{margin:4px 0 0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.bp-hero h1 span{color:var(--rls-red)}
.bp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bp-tools select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:8px 10px;font:600 13px var(--rls-sans);width:auto}
.bp-status{font-size:12px;color:#aaa;margin-top:8px}
.bp-status b{color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#333;margin-top:20px;border-radius:4px;overflow:hidden}
.kpi{background:#222;padding:14px 16px}
.kpi .v{font-size:22px;font-weight:800;white-space:nowrap}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#aaa;font-weight:600}
.kpi .v.neg{color:#ff6b81}.kpi .v.pos{color:#7fd6a0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:4px;padding:9px 14px;font:700 13px var(--rls-sans);cursor:pointer;text-decoration:none;transition:background .15s}
.btn-red{background:var(--rls-red);color:#fff}.btn-red:hover{background:var(--rls-red-dk)}
.btn-ghost{background:transparent;color:#fff;border:1px solid #555}.btn-ghost:hover{border-color:#fff}
.btn-line{background:#fff;color:var(--rls-black);border:1px solid var(--rls-warm-grey)}.btn-line:hover{border-color:var(--rls-black)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-x{background:none;border:0;color:#999;cursor:pointer;font-size:18px;line-height:1;padding:4px 6px}.btn-x:hover{color:var(--rls-red)}

/* Layout */
.bp-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.bp-nav{position:sticky;top:var(--bp-top-offset);background:#fff;border-radius:6px;padding:8px;border:1px solid var(--rls-warm-grey)}
.bp-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:9px 10px;font:600 13.5px var(--rls-sans);color:var(--rls-dark-grey);cursor:pointer}
.bp-nav button:hover{background:var(--rls-light-grey);color:var(--rls-black)}
.bp-nav button.on{background:var(--rls-black);color:#fff}
.bp-nav .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:700}
.bp-nav button.done .n{background:var(--rls-red);border-color:var(--rls-red);color:#fff}
.bp-nav .t{flex:1}

.sec{display:none;background:#fff;border-radius:6px;border:1px solid var(--rls-warm-grey);padding:28px}
.sec.on{display:block}
.sec-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--rls-warm-grey);padding-bottom:16px;margin-bottom:22px}
.sec-h h2{margin:0;font-size:24px;font-weight:800}
.sec-h p{margin:4px 0 0;color:var(--rls-dark-grey);max-width:640px}
.sec-num{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rls-red);font-weight:700}
h3{font-size:15px;font-weight:700;margin:28px 0 12px;text-transform:uppercase;letter-spacing:.06em}
.sec-h+h3,.sec-h+div h3:first-child{margin-top:0}
.sec-foot{display:flex;justify-content:space-between;gap:8px;margin-top:32px;padding-top:18px;border-top:1px solid var(--rls-warm-grey)}

/* Fields */
.row{display:grid;gap:14px 18px;margin-bottom:14px;align-items:end}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:12.5px;font-weight:600;color:var(--rls-dark-grey)}
.f small{font-size:11.5px;color:#888;font-weight:500}
input,textarea,select{font:500 14px var(--rls-sans);color:var(--rls-black);border:1px solid #D6D1CA;border-radius:4px;padding:9px 11px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rls-black);box-shadow:0 0 0 3px rgba(234,0,42,.12)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.iw{position:relative}
.iw em{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;color:#888;font-size:13px;font-weight:600;pointer-events:none}
.iw em.pre{left:10px}.iw em.post{right:10px}
.iw.hp input{padding-left:22px}.iw.hs input{padding-right:28px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.tip{background:var(--rls-light-grey);border-left:3px solid var(--rls-red);padding:12px 14px;border-radius:0 4px 4px 0;font-size:13.5px;color:var(--rls-dark-grey);margin:16px 0}
.tip b{color:var(--rls-black)}
.seg{display:inline-flex;border:1px solid #D6D1CA;border-radius:4px;overflow:hidden}
.seg button{background:#fff;border:0;padding:9px 14px;font:600 13px var(--rls-sans);cursor:pointer;color:var(--rls-dark-grey)}
.seg button+button{border-left:1px solid #D6D1CA}
.seg button.on{background:var(--rls-black);color:#fff}

/* Result cards */
.res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.res.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rc{border:1px solid var(--rls-warm-grey);border-top:3px solid var(--rls-red);border-radius:4px;padding:14px}
.rc .v{font-size:22px;font-weight:800}
.rc .l{font-size:12px;color:var(--rls-dark-grey);font-weight:600}
.rc.dark{background:var(--rls-black);color:#fff;border-color:var(--rls-black);border-top-color:var(--rls-red)}
.rc.dark .l{color:#bbb}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--rls-dark-grey);font-weight:700;padding:8px;border-bottom:2px solid var(--rls-black)}
td{padding:6px 8px;border-bottom:1px solid var(--rls-warm-grey);vertical-align:middle}
td input,td select,td textarea{padding:7px 9px;font-size:13.5px}
td .iw.hp input{padding-left:22px}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--rls-black);border-bottom:0}
.tbl-wrap{overflow-x:auto}

/* Activity funnel */
.funnel{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;border:1px solid var(--rls-warm-grey);border-radius:4px;overflow:hidden;margin:16px 0}
.funnel div{padding:10px 14px;border-bottom:1px solid var(--rls-warm-grey)}
.funnel .h{background:var(--rls-black);color:#fff;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.funnel .k{font-weight:600;color:var(--rls-dark-grey)}
.funnel .x{font-weight:800;text-align:right;font-size:17px}
.funnel .today{background:#FFF1F3}

/* Seasonality */
.season{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;margin:30px 0 10px}
.mo{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar-box{height:140px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar{width:70%;background:var(--rls-black);border-radius:3px 3px 0 0;min-height:2px;transition:height .25s;position:relative}
.bar.pk{background:var(--rls-red)}
.bar b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--rls-black)}
.mo .ml{font-size:12px;font-weight:700;color:var(--rls-dark-grey)}
.mo input{text-align:center;padding:6px 2px;font-size:13px}
.qs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}

/* Calendar */
.cal td{min-width:150px}
.cal td:first-child{min-width:110px;font-weight:700;font-size:12.5px;color:var(--rls-dark-grey);background:var(--rls-light-grey)}
.cal textarea{min-height:52px;font-size:13px;padding:6px 8px}
.qtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

/* Checklist */
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rls-warm-grey);border-radius:4px;margin-bottom:8px;cursor:pointer;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--rls-red);flex:0 0 18px}

/* SWOT */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.swot .f>span{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--rls-black)}
.swot textarea{min-height:150px}
.swot-l{font-size:11px;color:#888;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}

/* RYG */
.ryg button{width:100%;border:1px solid #D6D1CA;border-radius:4px;padding:9px;font:700 12px var(--rls-sans);cursor:pointer;background:#fff;color:#999}
.ryg button[data-s="1"]{background:#FDE3E6;border-color:var(--rls-red);color:var(--rls-red-dk)}
.ryg button[data-s="2"]{background:#FFF4D6;border-color:var(--amber);color:#8A5E00}
.ryg button[data-s="3"]{background:#DFF2E6;border-color:var(--green);color:var(--green)}

.flag{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:3px;display:inline-block}
.flag.ok{background:#DFF2E6;color:var(--green)}.flag.warn{background:#FFF4D6;color:#8A5E00}.flag.bad{background:#FDE3E6;color:var(--rls-red-dk)}

/* Summary */
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sum-card{border:1px solid var(--rls-warm-grey);border-radius:4px;padding:16px}
.sum-card h4{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rls-red)}
.sum-card dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0}
.sum-card dt{color:var(--rls-dark-grey)}.sum-card dd{margin:0;font-weight:700;text-align:right}
.sum-card p{margin:0 0 8px;white-space:pre-wrap}
.sum-card ol{margin:0;padding-left:18px}
.sum-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;text-align:center;font-size:12px}
.sum-months b{display:block;font-size:16px}
.muted{color:#999;font-style:italic}

.toast{opacity:0;pointer-events:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--rls-black);color:#fff;padding:11px 18px;border-radius:4px;font-weight:600;font-size:13.5px;transition:transform .25s;z-index:1000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.print-only{display:none}

@media (max-width:980px){
  .bp-grid{grid-template-columns:minmax(0,1fr)}
  .bp-nav{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .bp-nav button{flex:0 0 auto;width:auto;white-space:nowrap}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .res{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .sec{padding:18px}
  .c2,.c3,.c4,.swot,.sum-grid,.res.c3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .season{grid-template-columns:repeat(6,minmax(0,1fr))}
  .qs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .funnel{font-size:13px}
  .funnel div{padding:8px}
  .funnel .x{font-size:15px}
  .bp-hero{padding:22px 18px 18px}
  .bp-hero h1{font-size:24px}
  .kpi .v{font-size:18px}
  .sum-months{grid-template-columns:repeat(6,minmax(0,1fr))}
}

@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:11.5px}
  .bp{padding:0 2px;max-width:none}
  .sum-card,.rc,.funnel{break-inside:avoid}
  .bp-nav,.bp-tools,.sec-foot,.no-print,.btn,.btn-x,#sphere-header,body>header,body>nav{display:none!important}
  .bp-grid{display:block}
  .bp-hero,.rc,.funnel div,.bar,.kpi,.kpis,.ryg button,.flag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec{display:block;border:0;padding:0;break-before:page}
  body.print-summary .bp-hero{display:none}
  body.print-summary .sec{display:none}
  body.print-summary .sec#s-summary{display:block;break-before:auto}
  body.print-summary .sec#s-summary .sec-h{display:none}
  input,textarea,select{border:0;border-bottom:1px solid #ccc;border-radius:0;padding:3px 0;resize:none}
  .print-only{display:block}
  ::placeholder{color:transparent}
}
</style>
</head>

<div class="bp">
  <div class="bp-hero">
    <div class="bp-hero-top">

        <input type="file" id="import-file" accept="application/json" hidden>
      </div>

    <div class="kpis">
      <div class="kpi"><div class="v" data-o="gci">$0</div><div class="l">GCI goal</div></div>

</div>

<script>
(function(){
'use strict';

/* ---------------------------------------------------------------
   Reference data
---------------------------------------------------------------- */

const CAL_ROWS=[['call','Reason to call'],['text','Reason to text / email'],['popby','Pop-by idea'],['video','Video / social post'],['event','Event / client party']];
const PILLARS=[['build','Build — goals & numbers'],['brand','Brand — reputation & presence'],['amplify','Amplify — content & marketing'],['connect','Connect — sphere & referrals'],['simplify','Simplify — systems & delegation']];
const BIZ=[['desk','Brokerage desk / admin fees'],['board','Board & association dues'],['license','Licence & E&O insurance'],['tech','Technology, CRM & phone'],['vehicle','Vehicle & travel'],['coaching','Coaching & education'],['assistant','Assistant / admin support'],['prof','Accounting & legal'],['other','Other business']];

const IDEAS={
 call:['New-year market outlook','Spring plans check-in','Spring market is here: home value update','Tax season wrap-up: any plans this year?','Yard season check-in','Summer plans and a home value update','Stampede invite','Back-to-school check-in','Fall market update','Thanksgiving thank-you calls','Year-end review: any moves next year?','Holiday greetings and referral thank-yous'],
 text:['Assessment notice arrived? Happy to review it','Family Day weekend ideas','Clocks change: test your smoke detectors','Tax deadline reminder','Victoria Day long weekend','Happy Father’s Day','Happy Canada Day','Long weekend wishes','Back-to-school wishes','Happy Thanksgiving','Furnace filter reminder','Season’s greetings'],

};

function nextYearDefault(){const d=new Date();return d.getMonth()>=6?d.getFullYear()+1:d.getFullYear();}

function DEFAULT(){
 return {

  score:{q:[0,1,2,3].map(()=>({units:'',gci:'',notes:''})),ryg:{build:[0,0,0,0],brand:[0,0,0,0],amplify:[0,0,0,0],connect:[0,0,0,0],simplify:[0,0,0,0]}},
  letter:''
 };
}

function merge(base,src){
 if(src===null||src===undefined) return base;
 if(Array.isArray(base)){
  if(!Array.isArray(src)) return base;
  if(base.length&&typeof base[0]==='object'&&base[0]!==null){
   const tpl=base[0];
   return src.map((s,i)=>merge(JSON.parse(JSON.stringify(base[i]||tpl)),s));
  }
  return src.slice();
 }
 if(typeof base==='object'&&base!==null){
  if(typeof src!=='object') return base;
  Object.keys(src).forEach(k=>{ base[k]=(k in base)?merge(base[k],src[k]):src[k]; });
  return base;
 }
 return src;
}

/* ---------------------------------------------------------------
   Helpers
---------------------------------------------------------------- */
function getP(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],S);}
function setP(path,val){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=val;}
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>(v<0?'-$':'$')+Math.round(Math.abs(v)).toLocaleString('en-CA');
const moneyK=v=>{const a=Math.abs(v);const s=v<0?'-$':'$';return a>=1e6?s+(a/1e6).toFixed(2)+'M':a>=1e4?s+Math.round(a/1e3)+'K':money(v);};
const int=v=>Math.round(v).toLocaleString('en-CA');
const dec=v=>(Math.round(v*10)/10).toLocaleString('en-CA');
const pct=v=>Math.round(v*100)+'%';
const small=v=>v>0&&v<0.1?'<0.1':dec(v);

function F(label,key,o={}){
 const type=o.type||'text';
 const numeric=type==='money'||type==='pct'||type==='num';
 const inp=`<input data-k="${key}" type="${numeric?'number':type}" ${numeric?'inputmode="decimal" step="any"':''} placeholder="${esc(o.ph||'')}"${label?'':` aria-label="${esc(o.aria||key)}"`}>`;
 let wrap=inp;
 if(type==='money') wrap=`<div class="iw hp"><em class="pre">$</em>${inp}</div>`;
 if(type==='pct') wrap=`<div class="iw hs">${inp}<em class="post">%</em></div>`;
 if(!label) return wrap;
 return `<label class="f"><span>${label}${o.hint?` <small>${o.hint}</small>`:''}</span>${wrap}</label>`;
}
function T(label,key,o={}){
 return `<label class="f"><span>${label}${o.hint?` <small>${o.hint}</small>`:''}</span><textarea data-k="${key}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}"></textarea></label>`;
}
function tip(html){return `<div class="tip">${html}</div>`;}
function RC(label,key,cls=''){return `<div class="rc ${cls}"><div class="v" data-o="${key}">–</div><div class="l">${label}</div></div>`;}

function show(id,scroll){
 current=id;
 if(!S.meta.visited) S.meta.visited=[];
 if(!S.meta.visited.includes(id)){ S.meta.visited.push(id); queueSave(); }
 document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===id));
 if(id==='summary') renderSummary();
 if(C) recompute();
 if(scroll){ const top=document.querySelector('.bp-grid').getBoundingClientRect().top+window.scrollY-100; if(window.scrollY>top) window.scrollTo({top,behavior:'smooth'}); }
}

  if(el.type==='checkbox') el.checked=!!v;
  else el.value=(v===undefined||v===null)?'':v;
 });
 document.querySelectorAll('#method-seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.goals.method));
}

function onField(el){
 if(!el.dataset||!el.dataset.k) return;
 let v=el.type==='checkbox'?el.checked:el.value;
 if(el.type==='number'&&v!=='') v=parseFloat(v);
 setP(el.dataset.k,v);
 if(el.dataset.k==='goals.commModel') toggleVis();
 recompute(); queueSave();
}
document.addEventListener('input',e=>onField(e.target));
document.addEventListener('change',e=>{ const t=e.target; if(t.tagName==='SELECT'||t.type==='checkbox'||t.type==='date') onField(t); });

document.addEventListener('click',e=>{

 if(t.dataset.go){ show(t.dataset.go,true); return; }
 if(t.dataset.m){ if(t.dataset.m==='units'&&S.goals.method!=='units'){ const c=calc(); S.goals.listings=c.L; S.goals.buyers=c.B; } S.goals.method=t.dataset.m; fillAll(); toggleVis(); recompute(); queueSave(); return; }
 if(t.dataset.calq!==undefined){ calQ=+t.dataset.calq; renderCal(); return; }
 if(t.dataset.ryg){ const [k,q]=t.dataset.ryg.split('.'); const s=((S.score.ryg[k][q]||0)+1)%4; S.score.ryg[k][q]=s; t.dataset.s=s; t.textContent=['—','Red','Yellow','Green'][s]; queueSave(); return; }
 if(t.dataset.delTask!==undefined){ S.tasks.splice(+t.dataset.delTask,1); renderTasks(); fillAll(document.getElementById('task-body')); queueSave(); return; }
 if(t.dataset.delInit!==undefined){ S.inits.splice(+t.dataset.delInit,1); renderInits(); fillAll(document.getElementById('init-body')); recompute(); queueSave(); return; }
 switch(t.id){
  case 'task-add': S.tasks.push({task:'',owner:'',action:'',tool:''}); renderTasks(); fillAll(document.getElementById('task-body')); queueSave(); break;
  case 'init-add': S.inits.push({what:'',date:'',priority:'Medium'}); renderInits(); fillAll(document.getElementById('init-body')); queueSave(); break;
  case 'season-reset': S.season.w=SEASON_W.slice(); fillAll(document.getElementById('season')); recompute(); queueSave(); break;
  case 'use-budget': { const c=calc(); if(c.needs<=0){ toast('Add your personal budget on the Budget & Finances page first'); break; } S.goals.netGoal=Math.round(c.needs); fillAll(); recompute(); queueSave(); toast('Take-home goal set to '+money(c.needs)); break; }
  case 'cal-fill': { let k=0; S.cal.forEach((m,i)=>CAL_ROWS.forEach(([r])=>{ if(!m[r]&&IDEAS[r][i]){ m[r]=IDEAS[r][i]; k++; } })); renderCal(); recompute(); queueSave(); toast(k?`Added ${k} suggestions — edit any of them`:'Every cell already has something in it'); break; }
  case 'b-print-sum': case 'b-print-sum2': renderSummary(); document.body.classList.add('print-summary'); window.print(); break;

/* ---------------------------------------------------------------
   The math
---------------------------------------------------------------- */
function sumObj(o){return Object.values(o).reduce((a,v)=>a+n(v),0);}
function distribute(total,weights){
 const w=weights.map(x=>Math.max(n(x),0)); const tw=w.reduce((a,b)=>a+b,0)||1;
 const raw=w.map(x=>total*x/tw); const fl=raw.map(Math.floor); let rem=Math.round(total)-fl.reduce((a,b)=>a+b,0);
 raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){fl[i]++;rem--;}});
 return fl;
}
function calc(){
 const g=S.goals, k=S.kpi;
 const price=n(g.avgPrice);
 const gciSide=g.commModel==='flat'?price*n(g.flat)/100:Math.min(price,100000)*n(g.t1)/100+Math.max(price-100000,0)*n(g.t2)/100;
 const split=Math.min(Math.max(n(g.split),0),99)/100, t=Math.min(Math.max(n(g.tax),0),95)/100;
 const netSide=gciSide*(1-split);
 const mktgTotal=sumObj(S.mktg);
 const bizAnnual=sumObj(S.biz)*12+mktgTotal;
 const persAnnual=sumObj(S.pers)*12;
 const rrsp=n(S.save.rrsp), post=n(S.save.postTax), debtRed=n(S.save.debt);
 const needs=persAnnual+post+debtRed;
 let L,B,sides;
 if(g.method==='units'){ L=Math.max(0,Math.round(n(g.listings))); B=Math.max(0,Math.round(n(g.buyers))); sides=L+B; }
 else{
  const profitNeeded=n(g.netGoal)/(1-t)+rrsp;
  const netCommNeeded=profitNeeded+bizAnnual;
  sides=netSide>0?Math.max(Math.ceil(netCommNeeded/netSide-1e-9),0):0;
  L=Math.round(sides*Math.min(Math.max(n(g.listShare),0),100)/100); B=sides-L;
 }
 const gci=sides*gciSide, volume=sides*price, netComm=gci*(1-split);
 const profit=netComm-bizAnnual;
 const taxAmt=Math.max(profit-rrsp,0)*t;
 const takeHome=profit-rrsp-taxAmt;
 const surplus=takeHome-needs;
 const profitNeed=g.method==='units'?profit:n(g.netGoal)/(1-t)+rrsp;
 // activity
 const lRate=(n(k.lApptSign)/100)*(n(k.lSignClose)/100), bRate=(n(k.bConsSign)/100)*(n(k.bSignClose)/100);
 const lAp=lRate>0?L/lRate:0, bCo=bRate>0?B/bRate:0, lTk=n(k.lSignClose)>0?L/(n(k.lSignClose)/100):0;
 const conv=(lAp+bCo)*n(k.convPerAppt);
 const weeks=Math.max(52-n(k.weeksOff),1), days=Math.max(weeks*Math.min(Math.max(n(k.daysPerWeek),1),7),1);
 const hrs=n(k.convPerHour)>0?conv/n(k.convPerHour):0;
 const refY=sides*n(k.refPerClose), conY=refY*n(k.contactsPerRef);
 const months=distribute(sides,S.season.w);
 const qs=[0,1,2,3].map(q=>months[q*3]+months[q*3+1]+months[q*3+2]);
 const reserveMonthly=(persAnnual+bizAnnual)/12;
 return {price,gciSide,netSide,split,t,mktgTotal,bizAnnual,persAnnual,rrsp,needs,L,B,sides,gci,volume,netComm,profit,profitNeed,taxAmt,takeHome,surplus,
  lAp,bCo,lTk,conv,weeks,days,hrs,refY,conY,months,qs,reserveMonthly,reserves:n(S.save.reserves)};
}

function out(key,val,cls){
 document.querySelectorAll(`[data-o="${key}"]`).forEach(el=>{
  el.textContent=val;
  if(el.dataset.sign){el.classList.toggle('neg',cls==='neg');el.classList.toggle('pos',cls==='pos');}
 });
}

let C;
function recompute(){
 C=calc(); const c=C;
 const perW=v=>v/c.weeks, perD=v=>v/c.days;
 out('gciSide',money(c.gciSide)); out('netSide',money(c.netSide)); out('bizAnnual',money(c.bizAnnual)); out('profitNeed',money(c.profitNeed));
 out('gci',moneyK(c.gci)); out('sides',int(c.sides)); out('lb',`${int(c.L)} / ${int(c.B)}`); out('volume',moneyK(c.volume));
 out('surplus',moneyK(c.surplus),c.surplus<0?'neg':'pos');
 // season
 const mx=Math.max(...c.months,1);
 c.months.forEach((u,i)=>{const b=document.getElementById('bar'+i); if(b){b.style.height=(u/mx*100)+'%'; b.classList.toggle('pk',u===mx&&u>0&&c.months.filter(x=>x===mx).length<=3); document.getElementById('bu'+i).textContent=u;}});
 c.qs.forEach((q,i)=>out('q'+(i+1),int(q)+(q===1?' side':' sides')));
 // activity
 out('convY',int(c.conv)); out('convW',dec(perW(c.conv))); out('convDay',dec(perD(c.conv)));
 out('hrsY',int(c.hrs)); out('hrsW',small(perW(c.hrs))); out('hrsD',small(perD(c.hrs)));
 out('lApY',dec(c.lAp)); out('lApW',small(perW(c.lAp))); out('lApD',small(perD(c.lAp)));
 out('bCoY',dec(c.bCo)); out('bCoW',small(perW(c.bCo))); out('bCoD',small(perD(c.bCo)));
 out('lTkY',dec(c.lTk)); out('lTkW',small(perW(c.lTk))); out('lTkD',small(perD(c.lTk)));
 out('convPerClose',c.sides?int(c.conv/c.sides):'0'); out('workDays',int(c.days));
 out('refY',int(c.refY)); out('refM',dec(c.refY/12)); out('conM',int(c.conY/12)); out('contactsDay',dec(perD(c.conY)));
 // sources
 const sl=S.sources.reduce((a,s)=>a+n(s.last),0), sg=S.sources.reduce((a,s)=>a+n(s.goal),0);
 S.sources.forEach((s,i)=>{out('srcL'+i,sl&&s.last!==''?pct(n(s.last)/sl):'–');out('srcG'+i,sg&&s.goal!==''?pct(n(s.goal)/sg):'–');});
 out('srcLast',int(sl)); out('srcGoal',int(sg));
 const sf=document.getElementById('src-flag');
 if(sf) sf.innerHTML=!sg?'<span class="flag warn">Add your goal by source</span>':Math.round(sg)===c.sides?`<span class="flag ok">Matches your goal of ${c.sides} sides</span>`:`<span class="flag ${sg<c.sides?'bad':'warn'}">${sg<c.sides?'Short by '+int(c.sides-sg):'Over by '+int(sg-c.sides)} vs. your goal of ${c.sides}</span>`;
 // marketing
 MKTG.forEach(([k])=>out('mk_'+k,c.mktgTotal&&S.mktg[k]!==''?pct(n(S.mktg[k])/c.mktgTotal):'–'));
 out('mktgTotal',money(c.mktgTotal)); out('mktgPctGci',c.gci?pct(c.mktgTotal/c.gci)+' of GCI':'–'); out('mktgMonthly',money(c.mktgTotal/12));
 const pw=n(S.content.personal)+n(S.content.professional)+n(S.content.and); out('postsW',dec(pw)); out('postsY',int(pw*c.weeks));
 const bs=BRAND.filter(([k])=>S.brand[k]).length; out('brandScore',`${bs} of ${BRAND.length}`);
 // money
 out('persAnnual',money(c.persAnnual)); out('netComm',money(c.netComm)); out('taxAmt',money(c.taxAmt)); out('takeHome',money(c.takeHome));
 out('needs',money(c.needs)); out('bizPct',c.gci?pct(c.bizAnnual/c.gci):'–');
 out('reserveMonths',c.reserveMonthly>0?dec(c.reserves/c.reserveMonthly)+' mo':'–');
 const sb=c.netComm>0?c.bizAnnual/c.netComm:0, st=c.netComm>0?c.taxAmt/c.netComm:0, sp=Math.max(1-sb-st,0);
 out('sugAlloc',c.netComm>0?`${pct(sb)} business · ${pct(st)} tax · ${pct(sp)} personal & savings`:'set a goal first');
 const ab=S.alloc.biz!==''?n(S.alloc.biz)/100:sb, at=S.alloc.tax!==''?n(S.alloc.tax)/100:st, ap=S.alloc.pers!==''?n(S.alloc.pers)/100:sp;
 const tot=Math.round((ab+at+ap)*100);
 const ex=document.getElementById('alloc-ex');
 if(ex) ex.innerHTML=c.netSide>0?`<div class="tip">On a typical cheque of <b>${money(c.netSide)}</b> after split: <b>${money(c.netSide*ab)}</b> to business, <b>${money(c.netSide*at)}</b> to tax, <b>${money(c.netSide*ap)}</b> to personal & savings.${tot!==100?` <span class="flag warn">Your split adds up to ${tot}%</span>`:''}</div>`:'';
 // vs last year
 const vl=document.getElementById('vs-last'), ls=n(S.last.listings)+n(S.last.buyers);
 if(vl) vl.innerHTML=ls?`<div class="tip">Last year you closed <b>${int(ls)}</b> sides${n(S.last.gci)?` for <b>${money(n(S.last.gci))}</b> GCI`:''}. This plan calls for <b>${int(c.sides)}</b> — ${c.sides>=ls?`<b>${pct((c.sides-ls)/ls)}</b> more`:`<b>${pct((ls-c.sides)/ls)}</b> fewer`}.</div>`:'';
 // scorecard
 c.qs.forEach((q,i)=>{
  const tg=q*c.gciSide; out('tq'+i,int(q)); out('tg'+i,money(tg));
  const au=S.score.q[i].units, ag=S.score.q[i].gci;
  out('pace'+i,(au===''&&ag==='')?'–':(ag!==''&&tg>0)?pct(n(ag)/tg):(q>0?pct(n(au)/q):'–'));
 });
 // nav progress
 SECTIONS.forEach(s=>{
  const els=[...document.querySelectorAll('#s-'+s.id+' [data-k]')];
  const filled=els.filter(e=>e.type==='checkbox'?e.checked:e.value!=='').length;
  const b=document.getElementById('nav-'+s.id); if(b) b.classList.toggle('done',(S.meta.visited||[]).includes(s.id)&&filled>0);
 });
 if(current==='summary') renderSummary();
}

/* ---------------------------------------------------------------
   Save / load — private to each agent
   Firestore: users/{uid}/businessPlans/{year}
---------------------------------------------------------------- */
let uid=null, db=null, saveTimer=null, year=nextYearDefault(), ready=false;
const statusEl=document.getElementById('status');
function lsKey(){return `sphere-bizplan:${uid||'guest'}:${year}`;}
function setStatus(html){statusEl.innerHTML=html;}
function clean(){return JSON.parse(JSON.stringify(S));}
function docRef(){return db.collection('users').doc(uid).collection('businessPlans').doc(String(year));}

function queueSave(){
 if(!ready) return;
 clearTimeout(saveTimer); setStatus('Saving…');
 saveTimer=setTimeout(saveNow,900);
}
async function saveNow(){
 S.meta.year=year; S.meta.updated=new Date().toISOString();
 try{localStorage.setItem(lsKey(),JSON.stringify(S));}catch(e){}
 const time=new Date().toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});
 if(uid&&db){
  try{ await docRef().set({plan:clean(),year:year,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   setStatus(`<b>Saved to your account</b> · ${time} · only you can see this plan`); }
  catch(e){ console.warn('Business plan save failed',e); setStatus(`<b>Saved on this device</b> · ${time} · couldn’t reach your account, will retry on your next change`); }
 } else setStatus(`<b>Saved on this device</b> · ${time} · sign in to keep it in your account`);
}

async function loadPlan(){
 ready=false; let data=null;
 if(uid&&db){ try{ const s=await docRef().get(); if(s.exists) data=s.data().plan; }catch(e){ console.warn('Business plan load failed',e); } }
 if(!data){ try{ const l=localStorage.getItem(lsKey())||(uid?localStorage.getItem(`sphere-bizplan:guest:${year}`):null); if(l) data=JSON.parse(l); }catch(e){} }
 S=merge(DEFAULT(),data||{}); S.meta.year=year;
 document.getElementById('h-year').textContent=year;
 renderShell(); fillAll(); toggleVis(); recompute();
 setStatus(data?(uid?'<b>Plan loaded</b> · private to your account':'<b>Plan loaded from this device</b>'):(uid?'<b>New plan</b> · saves privately to your account as you type':'<b>New plan</b> · saves on this device as you type'));
 ready=true;
}

function exportPlan(){
 const blob=new Blob([JSON.stringify(clean(),null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`business-plan-${year}.json`; document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById('import-file').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d!=='object'||!d.goals) throw new Error('bad');
   if(!confirm(`Replace your ${year} plan with the imported file?`)) return;
   S=merge(DEFAULT(),d); S.meta.year=year; renderShell(); fillAll(); toggleVis(); recompute(); ready=true; saveNow(); toast('Plan imported'); }
  catch(err){ toast('That file isn’t a business plan export'); } finally{ e.target.value=''; } };
 r.readAsText(f);
});

const ysel=document.getElementById('year-sel');
function fillYears(){ const y0=new Date().getFullYear(); const ys=[y0-1,y0,y0+1,y0+2]; if(!ys.includes(year)) ys.push(year); ysel.innerHTML=ys.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y} plan</option>`).join(''); }
ysel.addEventListener('change',async()=>{ clearTimeout(saveTimer); if(ready) await saveNow(); year=+ysel.value; loadPlan(); });

let toastT; function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);}

function init(){
 const qy=parseInt(new URLSearchParams(location.search).get('year'),10); if(qy>2000&&qy<2100) year=qy;
 fillYears();
 let fb=false;
 try{ fb=!!(window.firebase&&firebase.apps&&firebase.apps.length); }catch(e){}
 if(fb){
  try{ db=firebase.firestore(); }catch(e){ db=null; }
  let first=true;
  firebase.auth().onAuthStateChanged(u=>{ const nu=u?u.uid:null; if(first||nu!==uid){ first=false; uid=nu; loadPlan(); } });
 } else loadPlan();
}
init();
})();
</script>
</body>
