<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMA Builder — Inside The Sphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --obs:#0F0F0F;--esp:#2C2420;--stone:#8C8479;
  --parch:#EDE8E0;--ivory:#F7F4EF;--border:#D9D3CB;
  --champ:#C9A96E;--copper:#A0714F;--sage:#4A5C4E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,sans-serif;
}
body{font-family:var(--sans);background:var(--ivory);color:var(--obs);min-height:100vh;display:flex}

/* ── SIDEBAR — identical on every page ── */
.sidebar{
  width:220px;flex-shrink:0;background:#fff;
  border-right:0.5px solid #D9D3CB;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:100;
  font-family:'Inter',-apple-system,sans-serif;
}
.sb-logo{padding:22px 20px 18px;border-bottom:0.5px solid #D9D3CB;flex-shrink:0}
.sb-logo-text{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:1rem;font-weight:300;color:#0F0F0F;
  letter-spacing:.04em;line-height:1.2;
  text-decoration:none;display:block;
}
.sb-logo-text span{color:#A0714F}
.sb-logo-sub{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#D9D3CB;margin-top:3px;display:block}
.sb-section{font-size:8px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#D9D3CB;padding:14px 20px 5px;flex-shrink:0;display:block}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;font-weight:400;color:#8C8479;border-left:2px solid transparent;transition:color .12s,background .12s,border-color .12s;text-decoration:none;background:transparent;font-family:'Inter',sans-serif}
.sb-item:hover{color:#0F0F0F;background:#F7F4EF}
.sb-item.active{color:#0F0F0F;font-weight:500;border-left-color:#A0714F;background:#F7F4EF}
.sb-item.soon{opacity:.4;pointer-events:none;cursor:default}
.sb-soon-tag{font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#D9D3CB;margin-left:auto}
.sb-footer{margin-top:auto;padding:14px 20px;border-top:0.5px solid #D9D3CB;flex-shrink:0}
.sb-agent{display:flex;align-items:center;gap:10px;padding:8px;border-radius:2px;text-decoration:none;transition:background .12s;background:transparent;width:100%}
.sb-agent:hover{background:#F7F4EF}
.sb-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid #D9D3CB;display:block}
.sb-initials{width:32px;height:32px;border-radius:50%;background:#A0714F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;letter-spacing:.04em}
.sb-name{font-size:12px;font-weight:500;color:#0F0F0F;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-role{font-size:10px;color:#8C8479;margin-top:1px;display:block}
.sb-logout{width:100%;margin-top:8px;padding:8px;border:0.5px solid #D9D3CB;background:transparent;border-radius:2px;font-size:10px;font-weight:500;color:#8C8479;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:border-color .12s,color .12s;display:block}
.sb-logout:hover{border-color:#0F0F0F;color:#0F0F0F}

/* MAIN */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{
  background:#fff;border-bottom:0.5px solid var(--border);
  padding:0 36px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar-title{font-size:13px;font-weight:500;color:var(--obs)}
.btn-new{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;background:var(--obs);border:none;border-radius:2px;
  font-size:11px;font-weight:500;color:#fff;cursor:pointer;
  font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;
  transition:background .12s;
}
.btn-new:hover{background:var(--esp)}

/* PAGE */
.page{padding:36px;flex:1}

/* CMA TABLE */
.cma-table{
  background:#fff;border:0.5px solid var(--border);
  margin-bottom:32px;
}
.cma-header-row{
  display:grid;grid-template-columns:1fr 140px 110px 110px 110px 120px;
  gap:0;background:var(--ivory);
  border-bottom:0.5px solid var(--border);
  padding:10px 20px;
}
.col-lbl{
  font-size:9px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--stone);
}
.cma-row{
  display:grid;grid-template-columns:1fr 140px 110px 110px 110px 120px;
  gap:0;align-items:center;
  padding:16px 20px;border-bottom:0.5px solid var(--border);
  transition:background .12s;cursor:pointer;
}
.cma-row:last-child{border-bottom:none}
.cma-row:hover{background:var(--ivory)}
.cma-address{
  font-family:var(--serif);font-size:1rem;
  font-weight:400;color:var(--obs);line-height:1.2;
}
.cma-client{font-size:11px;color:var(--stone);margin-top:3px}
.cma-community{font-size:12px;color:var(--stone)}
.cma-date{font-size:12px;color:var(--stone)}
.cma-price{font-family:var(--serif);font-size:1rem;font-weight:400;color:var(--champ)}
.status-badge{
  display:inline-block;font-size:9px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;
}
.s-pub{background:rgba(74,92,78,.08);color:var(--sage);border:0.5px solid rgba(74,92,78,.2)}
.s-draft{background:var(--ivory);color:var(--stone);border:0.5px solid var(--border)}
.cma-actions{display:flex;gap:6px;align-items:center}
.act-btn{
  font-size:10px;font-weight:500;letter-spacing:.06em;
  padding:5px 10px;border-radius:2px;cursor:pointer;
  font-family:var(--sans);transition:all .12s;border:none;
  text-decoration:none;display:inline-flex;align-items:center;
}
.act-edit{background:var(--obs);color:#fff}
.act-edit:hover{background:var(--esp)}
.act-view{background:var(--ivory);color:var(--stone);border:0.5px solid var(--border)}
.act-view:hover{color:var(--obs);border-color:var(--obs)}
.act-del{background:transparent;color:#D9D3CB;border:none;font-size:14px;padding:4px 6px}
.act-del:hover{color:#c0392b}

/* EMPTY */
.empty{
  padding:64px 20px;text-align:center;
  background:#fff;border:0.5px solid var(--border);
}
.empty-title{
  font-family:var(--serif);font-size:1.6rem;font-weight:300;
  color:var(--obs);margin-bottom:8px;
}
.empty-sub{font-size:13px;color:var(--stone);margin-bottom:24px;line-height:1.6}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,15,15,.5);
  z-index:200;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all .2s;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  background:#fff;border-radius:2px;width:100%;max-width:540px;
  margin:20px;animation:mIn .2s ease;
}
@keyframes mIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{
  padding:20px 24px;border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{
  font-family:var(--serif);font-size:1.3rem;font-weight:300;color:var(--obs);
}
.modal-close{
  background:none;border:none;font-size:18px;color:var(--stone);
  cursor:pointer;padding:4px;transition:color .12s;
}
.modal-close:hover{color:var(--obs)}
.modal-body{padding:24px}
.fg{margin-bottom:16px}
.fg:last-child{margin-bottom:0}
.fg label{
  display:block;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--stone);margin-bottom:6px;
}
.fg input,.fg select{
  width:100%;padding:10px 12px;background:var(--ivory);
  border:0.5px solid var(--border);border-radius:2px;
  font-size:14px;color:var(--obs);font-family:var(--sans);
  transition:all .12s;
}
.fg input:focus,.fg select:focus{
  outline:none;border-color:var(--obs);background:#fff;
}
.fg input::placeholder{color:var(--border)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-footer{
  padding:16px 24px;border-top:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
}
.btn-cancel{
  padding:9px 18px;background:transparent;border:0.5px solid var(--border);
  border-radius:2px;font-size:12px;font-weight:500;color:var(--stone);
  cursor:pointer;font-family:var(--sans);letter-spacing:.06em;
  transition:all .12s;
}
.btn-cancel:hover{border-color:var(--obs);color:var(--obs)}
.btn-create{
  padding:9px 20px;background:var(--obs);border:none;border-radius:2px;
  font-size:12px;font-weight:500;color:#fff;cursor:pointer;
  font-family:var(--sans);letter-spacing:.08em;text-transform:uppercase;
  transition:background .12s;
}
.btn-create:hover{background:var(--esp)}
.btn-create:disabled{opacity:.5;cursor:not-allowed}

/* TOAST */
.toast{
  position:fixed;bottom:20px;right:20px;background:var(--obs);
  color:#fff;border-radius:2px;padding:10px 16px;
  font-size:12px;font-weight:500;z-index:500;
  transform:translateY(50px);opacity:0;transition:all .25s;
  letter-spacing:.04em;
}
.toast.show{transform:translateY(0);opacity:1}

/* LOADING */
.loading{
  margin-left:220px;display:flex;align-items:center;
  justify-content:center;min-height:100vh;flex-direction:column;gap:14px;
}
.spinner{
  width:28px;height:28px;border:2px solid var(--border);
  border-top-color:var(--copper);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .sidebar{display:none}
  .main,.loading{margin-left:0}
  .cma-header-row,.cma-row{grid-template-columns:1fr 80px 80px}
  .cma-header-row > *:nth-child(n+4),.cma-row > *:nth-child(n+4){display:none}
  .page{padding:20px}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p style="font-size:13px;color:var(--stone)">Loading...</p>
</div>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar" style="display:none">
  <div class="sb-logo">
    <a href="../smarttools/" class="sb-logo-text">Inside The <span>Sphere</span></a>
    <div class="sb-logo-sub">Real Estate Tools</div>
  </div>
  <div class="sb-section">Tools</div>
  <a href="../smarttools/" class="sb-item"><span>◻</span> Dashboard</a>
  <a href="../cma/" class="sb-item active"><span>◻</span> CMA Builder</a>
  <a href="../newsletter/" class="sb-item"><span>◻</span> Newsletter</a>
  <a href="../Bold-trail-newsletter/" class="sb-item"><span>◻</span> Bold Trail</a>
  <div class="sb-section">Coming soon</div>
  <div class="sb-item soon"><span>◻</span> Listing Checklist <span class="sb-soon">Soon</span></div>
  <div class="sb-item soon"><span>◻</span> Buyer Checklist <span class="sb-soon">Soon</span></div>
  <div class="sb-item soon"><span>◻</span> Market Reports <span class="sb-soon">Soon</span></div>
  <div class="sb-footer">
    <a href="../profile.html" class="sb-agent" id="sb-agent">
      <div class="sb-initials" id="sb-initials">KD</div>
      <div>
        <div class="sb-name" id="sb-name">Kyle Duiker</div>
        <div class="sb-role" id="sb-role">Broker Delegate</div>
      </div>
    </a>
    <button class="sb-logout" onclick="doLogout()">Log out</button>
  </div>
</nav>

<!-- MAIN -->
<div class="main" id="main" style="display:none">
  <div class="topbar">
    <div class="topbar-title">CMA Builder</div>
    <button class="btn-new" onclick="openModal()">+ New CMA</button>
  </div>
  <div class="page">
    <div id="cma-container"></div>
  </div>
</div>

<!-- CREATE MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New market evaluation</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg-row">
        <div class="fg">
          <label>Client name(s)</label>
          <input id="m-client" placeholder="John & Sarah Smith">
        </div>
        <div class="fg">
          <label>Appointment date</label>
          <input type="date" id="m-date">
        </div>
      </div>
      <div class="fg">
        <label>Property address</label>
        <input id="m-address" placeholder="264 Mahogany Cove SE, Calgary">
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>Community</label>
          <select id="m-community">
            <option value="">Select community</option>
            <option>Mahogany</option><option>Auburn Bay</option>
            <option>Seton</option><option>Cranston</option>
            <option>Legacy</option><option>Chestermere</option>
            <option>Other</option>
          </select>
        </div>
        <div class="fg">
          <label>Client email</label>
          <input type="email" id="m-email" placeholder="client@email.com">
        </div>
      </div>
      <div class="fg">
        <label>Client page password</label>
        <input id="m-password" placeholder="e.g. Mahogany2026">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-create" id="btn-create" onclick="createCMA()">Create CMA →</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let cmas = [];

firebase.auth().onAuthStateChanged(user => {
  if (!user) { window.location.href = '../login.html'; return; }
  currentUser = user;
  loadSidebar(user);
  loadCMAs(user);
});

function loadSidebar(user) {
  db.collection('users').doc(user.uid).get().then(doc => {
    if (!doc.exists) return;
    const p = doc.data().agentProfile || {};
    const first = p.firstName || user.displayName?.split(' ')[0] || 'Kyle';
    const last  = p.lastName  || '';
    const title = p.title || 'Agent';
    const initials = ((first.charAt(0)) + (last.charAt(0)||'')).toUpperCase();
    const headshot = p.photoUrls?.headshot || '';

    document.getElementById('sb-name').textContent = [first,last].filter(Boolean).join(' ');
    document.getElementById('sb-role').textContent = title;
    document.getElementById('sb-initials').textContent = initials;

    if (headshot) {
      const init = document.getElementById('sb-initials');
      const img = document.createElement('img');
      img.src = headshot; img.className = 'sb-avatar'; img.alt = first;
      img.onerror = () => img.replaceWith(init);
      init.replaceWith(img);
    }
  }).catch(console.error);
}

function loadCMAs(user) {
  db.collection('users').doc(user.uid).collection('cmas')
    .orderBy('updatedAt','desc').get()
    .then(snap => {
      cmas = snap.docs.map(d => ({id:d.id, ...d.data()}));
      renderCMAs();
    })
    .catch(console.error)
    .finally(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('sidebar').style.display = 'flex';
      document.getElementById('main').style.display = 'flex';
    });
}

function renderCMAs() {
  const container = document.getElementById('cma-container');
  if (!cmas.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-title">No market evaluations yet</div>
        <div class="empty-sub">Create your first CMA and send a private,<br>password-protected report to your client.</div>
        <button class="btn-new" onclick="openModal()">+ Create your first CMA</button>
      </div>`;
    return;
  }

  const fmt = v => v ? '$'+Math.round(parseFloat(v)).toLocaleString() : '—';
  const fmtDate = d => {
    if (!d) return '—';
    try { return new Date(d+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}); }
    catch { return d; }
  };

  container.innerHTML = `
    <div class="cma-table">
      <div class="cma-header-row">
        <div class="col-lbl">Address</div>
        <div class="col-lbl">Community</div>
        <div class="col-lbl">Date</div>
        <div class="col-lbl">Price</div>
        <div class="col-lbl">Status</div>
        <div class="col-lbl">Actions</div>
      </div>
      ${cmas.map(c => {
        const pub = c.status === 'published';
        const slug = c.slug || '';
        return `<div class="cma-row">
          <div>
            <div class="cma-address">${c.address || 'No address'}</div>
            <div class="cma-client">${c.clientName || ''}</div>
          </div>
          <div class="cma-community">${c.community || '—'}</div>
          <div class="cma-date">${fmtDate(c.appointmentDate)}</div>
          <div class="cma-price">${fmt(c.priceRec)}</div>
          <div><span class="status-badge ${pub?'s-pub':'s-draft'}">${pub?'Published':'Draft'}</span></div>
          <div class="cma-actions">
            <a href="edit.html?id=${c.id}" class="act-btn act-edit">Edit</a>
            ${slug ? `<a href="client/?slug=${slug}" target="_blank" class="act-btn act-view">View</a>` : ''}
            <button class="act-btn act-del" onclick="deleteCMA('${c.id}',event)" title="Delete">✕</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// MODAL
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('m-date').valueAsDate = new Date();
  setTimeout(() => document.getElementById('m-client').focus(), 100);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['m-client','m-address','m-email','m-password'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('m-community').selectedIndex = 0;
}

function generateSlug(address, date) {
  const addr = (address || '').toLowerCase()
    .replace(/[^a-z0-9\s]/g,'').trim()
    .replace(/\s+/g,'-').slice(0,40);
  const num = Math.floor(Math.random() * 90000) + 10000;
  return addr + '-' + num;
}

function createCMA() {
  const client   = document.getElementById('m-client').value.trim();
  const address  = document.getElementById('m-address').value.trim();
  const date     = document.getElementById('m-date').value;
  const community= document.getElementById('m-community').value;
  const email    = document.getElementById('m-email').value.trim();
  const password = document.getElementById('m-password').value.trim();

  if (!address) { showToast('Please enter the property address'); return; }
  if (!password) { showToast('Please set a client password'); return; }

  const btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'Creating...';

  const slug = generateSlug(address, date);
  const now = firebase.firestore.FieldValue.serverTimestamp();

  db.collection('users').doc(currentUser.uid).collection('cmas').add({
    clientName: client, address, appointmentDate: date,
    community, clientEmail: email, clientPassword: password,
    slug, status: 'draft', agentId: currentUser.uid,
    createdAt: now, updatedAt: now,
  })
  .then(ref => {
    closeModal();
    btn.disabled = false; btn.textContent = 'Create CMA →';
    window.location.href = `edit.html?id=${ref.id}`;
  })
  .catch(err => {
    console.error(err);
    btn.disabled = false; btn.textContent = 'Create CMA →';
    showToast('Error creating CMA — please try again');
  });
}

function deleteCMA(id, e) {
  e.stopPropagation();
  if (!confirm('Delete this CMA? This cannot be undone.')) return;
  db.collection('users').doc(currentUser.uid).collection('cmas').doc(id).delete()
    .then(() => {
      cmas = cmas.filter(c => c.id !== id);
      renderCMAs();
      showToast('CMA deleted');
    })
    .catch(err => { console.error(err); showToast('Error deleting CMA'); });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function doLogout() {
  if (confirm('Log out?')) {
    firebase.auth().signOut().then(() => window.location.href = '../login.html');
  }
}
</script>
</body>
</html>
